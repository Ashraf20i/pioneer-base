<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0d17; overflow: hidden; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { width: 100%; height: 100%; display: block; }
    #msg { position: fixed; color: #cde; font: 18px sans-serif; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas"></canvas></div>
  <div id="msg">Loading...</div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}"
    }, function (p) { document.getElementById("msg").textContent = "Loading " + Math.round(p * 100) + "%"; })
      .then(function () { document.getElementById("msg").style.display = "none"; })
      .catch(function (e) { document.getElementById("msg").textContent = "Error: " + e; });
  </script>
</body>
</html>
